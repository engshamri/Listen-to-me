name: Production check

# Daily smoke test of the public site. Speech depends on Microsoft's free
# read-aloud service, whose connection token changes when Microsoft updates
# Edge; this catches that, or any other outage, within a day. No secrets needed.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live smoke checks against production
        env:
          SMOKE: "1"
          BASE_URL: https://listen-to-me-shamri.vercel.app
        run: node scripts/live-check.mjs
      - name: Open or update an issue when the check fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Production check failed";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The daily smoke check of https://listen-to-me-shamri.vercel.app failed: ${run}`,
              "",
              "If speech requests fail with HTTP 403, Microsoft has probably changed the read-aloud connection token:",
              "see the \"Speech service client\" section of docs/ARCHITECTURE.md.",
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 100 });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });
